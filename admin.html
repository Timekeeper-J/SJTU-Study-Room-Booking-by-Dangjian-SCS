<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室预约管理</title>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .panel { background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 8px 30px -20px rgba(15, 23, 42, 0.35); }
        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" class="max-w-6xl mx-auto p-4 md:p-8" v-cloak>
        <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-200 pb-5">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-800">自习室预约管理</h1>
                <p class="mt-2 text-sm text-slate-500">管理员口令只会发送给 LeanCloud 云函数校验，不写在网页源码里。</p>
            </div>
            <a href="./index.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-700">返回预约页</a>
        </header>

        <section v-if="!verified" class="panel max-w-md p-5">
            <label class="block text-sm font-bold text-slate-700 mb-2">管理员口令</label>
            <input v-model.trim="passcode" @keyup.enter="verifyAdmin" type="password" autocomplete="current-password"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="输入云函数环境变量中的口令">
            <button @click="verifyAdmin" class="mt-4 w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white hover:bg-indigo-700">
                进入管理
            </button>
            <p v-if="errorMsg" class="mt-3 text-sm text-red-600">${ errorMsg }</p>
        </section>

        <section v-else>
            <div class="mb-5 flex items-center justify-between gap-3">
                <p class="text-sm text-emerald-700 font-bold">管理员已验证</p>
                <div class="flex gap-2">
                    <button @click="fetchData" class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-bold text-slate-600 hover:bg-slate-200">刷新</button>
                    <button @click="logoutAdmin" class="rounded-lg bg-red-50 px-3 py-2 text-xs font-bold text-red-600 hover:bg-red-100">退出</button>
                </div>
            </div>

            <div v-if="loading" class="text-sm text-slate-500">正在加载预约数据...</div>
            <div v-else class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                <article v-for="day in days" :key="day.dateStr" class="panel p-4">
                    <h2 class="mb-4 text-lg font-extrabold text-slate-800">${ formatDate(day.dateStr) }</h2>
                    <div class="space-y-4">
                        <div v-for="slot in day.slots" :key="slot.id" class="rounded-lg border border-slate-200 p-3">
                            <div class="mb-2 flex items-center justify-between">
                                <h3 class="text-sm font-bold text-slate-700">${ slot.label }</h3>
                                <span class="text-xs text-slate-400">${ slot.id }</span>
                            </div>

                            <div class="space-y-2 text-sm">
                                <div class="flex items-center justify-between gap-3 rounded bg-indigo-50 px-3 py-2">
                                    <span class="min-w-0 truncate text-indigo-900">预约人：${ slot.booker || '无' }</span>
                                    <button v-if="slot.booker" @click="adminDelete(day, slot, 'booker', slot.booker)"
                                            class="shrink-0 rounded bg-white px-2 py-1 text-xs font-bold text-red-600 hover:bg-red-50">
                                        删除
                                    </button>
                                </div>

                                <div v-if="slot.followers && slot.followers.length" class="flex flex-wrap gap-2">
                                    <span v-for="f in slot.followers" :key="f" class="inline-flex items-center gap-2 rounded bg-slate-100 px-2 py-1 text-xs text-slate-700">
                                        ${ f }
                                        <button @click="adminDelete(day, slot, 'follower', f)" class="font-bold text-red-500 hover:text-red-700">删除</button>
                                    </span>
                                </div>
                                <div v-else class="text-xs text-slate-400">暂无随行人</div>
                            </div>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <script>
        const APP_ID = 'MpWMjFVRc0H3Y5BAQuUk0DN7-gzGzoHsz';
        const APP_KEY = '6VXWHUYqbTjNVtqqnhmoJOzN';
        const SERVER_URL = 'https://avoscloud.com';

        const { createApp, ref, onMounted } = Vue;
        if (typeof AV !== 'undefined') { AV.init({ appId: APP_ID, appKey: APP_KEY, serverURLs: SERVER_URL }); }

        createApp({
            compilerOptions: { delimiters: ['${', '}'] },
            setup() {
                const passcode = ref(sessionStorage.getItem('booking_admin_passcode') || '');
                const verified = ref(false);
                const errorMsg = ref('');
                const loading = ref(false);
                const days = ref([]);

                const buildEmptyDays = () => {
                    const arr = [];
                    for (let i = 0; i < 8; i++) {
                        const d = new Date();
                        d.setDate(d.getDate() + i);
                        const dateStr = d.toISOString().split('T')[0];
                        arr.push({
                            dateStr,
                            slots: [
                                { id: 's1', label: '09:00 - 13:00', booker: null, followers: [] },
                                { id: 's2', label: '14:00 - 18:00', booker: null, followers: [] },
                                { id: 's3', label: '19:00 - 22:30', booker: null, followers: [] }
                            ]
                        });
                    }
                    days.value = arr;
                };

                const verifyAdmin = async () => {
                    errorMsg.value = '';
                    if (!passcode.value) {
                        errorMsg.value = '请输入管理员口令';
                        return;
                    }
                    try {
                        await AV.Cloud.run('adminPing', { passcode: passcode.value });
                        sessionStorage.setItem('booking_admin_passcode', passcode.value);
                        verified.value = true;
                        await fetchData();
                    } catch (error) {
                        console.error(error);
                        errorMsg.value = '口令错误，或云函数尚未部署成功';
                    }
                };

                const fetchData = async () => {
                    loading.value = true;
                    buildEmptyDays();
                    try {
                        const query = new AV.Query('Booking');
                        query.greaterThanOrEqualTo('date', days.value[0].dateStr);
                        const results = await query.find();
                        results.forEach(record => {
                            const data = record.toJSON();
                            const targetDay = days.value.find(d => d.dateStr === data.date);
                            if (!targetDay || !data.slots) return;
                            targetDay.objectId = record.objectId;
                            targetDay.slots.forEach(slot => {
                                if (data.slots[slot.id]) Object.assign(slot, data.slots[slot.id]);
                            });
                        });
                    } catch (error) {
                        console.error(error);
                        errorMsg.value = '加载预约数据失败';
                    } finally {
                        loading.value = false;
                    }
                };

                const adminDelete = async (day, slot, role, targetName) => {
                    if (!confirm(`确定删除 ${targetName} 吗？`)) return;
                    try {
                        await AV.Cloud.run('adminDeleteBooking', {
                            passcode: passcode.value,
                            date: day.dateStr,
                            slotId: slot.id,
                            role,
                            targetName
                        });
                        await fetchData();
                    } catch (error) {
                        console.error(error);
                        alert('删除失败，请确认云函数和管理员口令是否正确');
                    }
                };

                const logoutAdmin = () => {
                    sessionStorage.removeItem('booking_admin_passcode');
                    passcode.value = '';
                    verified.value = false;
                    days.value = [];
                };

                const formatDate = (str) => {
                    const d = new Date(str);
                    const week = ['周日','周一','周二','周三','周四','周五','周六'];
                    return `${d.getMonth() + 1}.${d.getDate()} ${week[d.getDay()]}`;
                };

                onMounted(() => {
                    buildEmptyDays();
                    if (passcode.value) verifyAdmin();
                });

                return { passcode, verified, errorMsg, loading, days, verifyAdmin, fetchData, adminDelete, logoutAdmin, formatDate };
            }
        }).mount('#app');
    </script>
</body>
</html>
